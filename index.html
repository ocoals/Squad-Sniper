          keyframes: {

            flyOff: {
              '0%': { transform: 'scale(1) translateY(0) rotate(0deg)', opacity: '1' },

  <style>
    html {
      overflow-y: scroll;
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #02040a;
      color: white;
      overflow-x: hidden;
    }

    .perspective-container {
      perspective: 1200px;
      perspective-origin: 50% 30%;
    }

    /* Realistic Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.8) 80%, rgba(0, 0, 0, 1) 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* Fog Layer */
    .fog-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/92.svg');
      /* Using a placeholder texture hack or gradient is safer, but let's use CSS gradient for fog */
      background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0) 100%);
      background-size: 200% 100%;
      animation: fogFlow 15s linear infinite;
      pointer-events: none;
      z-index: 5;
      mix-blend-mode: overlay;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .stadium-bg {
      background-image: url('https://images.unsplash.com/photo-1517927033932-b3d18e61fb3a?q=80&w=2560&auto=format&fit=crop');
      background-size: cover;
      background-position: center bottom;
      background-attachment: fixed;
    }
  </style>
