<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - 페이지를 찾을 수 없습니다 | SQUAD SNIPER</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/Logo.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #02040a 0%, #051c05 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1517927033932-b3d18e61fb3a?q=80&w=2560&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      z-index: 0;
    }

    .container {
      text-align: center;
      max-width: 600px;
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 60px 40px;
      border: 1px solid rgba(0, 243, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .error-code {
      font-size: 120px;
      font-weight: 900;
      background: linear-gradient(135deg, #00f3ff 0%, #0aff0a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 20px;
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.5));
      }
      50% {
        filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.8));
      }
    }

    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    p {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f3ff 0%, #0aff0a 100%);
      color: #02040a;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 243, 255, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .links {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .links h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: rgba(255, 255, 255, 0.9);
    }

    .links ul {
      list-style: none;
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      color: #00f3ff;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .links a:hover {
      color: #0aff0a;
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .error-code {
        font-size: 80px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 16px;
      }

      .container {
        padding: 40px 24px;
      }

      .buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .links ul {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>
      요청하신 페이지가 존재하지 않거나 이동되었습니다.<br>
      URL을 확인하시거나 홈페이지로 돌아가주세요.
    </p>

    <div class="buttons">
      <a href="/" class="btn btn-primary">홈으로 돌아가기</a>
      <button onclick="history.back()" class="btn btn-secondary">이전 페이지</button>
    </div>

    <div class="links">
      <h2>바로가기</h2>
      <ul>
        <li><a href="/">홈</a></li>
        <li><a href="/privacy.html">개인정보처리방침</a></li>
        <li><a href="/terms.html">이용약관</a></li>
      </ul>
    </div>
  </div>
</body>
</html>
